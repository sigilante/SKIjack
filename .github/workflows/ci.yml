name: CI

# A change only to prose skips CI. SPEC.md is read by the suite, and
# python/README.md and python/LICENSE go into the package the build job
# checks, so those three still run it.
on:
  push:
    branches: [master]
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!img/**"
      - "!LICENSE"
      - "SPEC.md"
      - "python/README.md"
      - "python/LICENSE"
  pull_request:
    branches: [master]
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!img/**"
      - "!LICENSE"
      - "SPEC.md"
      - "python/README.md"
      - "python/LICENSE"

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "python[test]"
      # The oracle scripts are vendored at python/tests/artifact, so the
      # suite runs whole but for the front-end tests, which need AVON.
      - name: Test
        working-directory: python
        run: python -m pytest -q

  # Every reduction the suite makes, run by Avon and by aviary and compared
  # (SKIJACK_REDUCER=check), with the front-end tests, which need Avon too.
  # Avon is built at a pinned commit, one whose template loader reads a
  # referenced term in the DAG form, as skijack.templates writes it, and
  # whose front0 reads front1's ROk with its templates and emits them.
  avon:
    name: pytest, every reduction checked against Avon
    runs-on: ubuntu-24.04
    env:
      AVON_REF: ef4721afb715d2d55620562d580458ea88c38011   # sigilante/avon #91, front0 --emit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sigilante/avon
          ref: ${{ env.AVON_REF }}
          path: avon
      - name: Build Avon
        run: make -C avon -j4 CC=clang-18 build/avon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "python[test]"
      - name: Test
        working-directory: python
        env:
          AVON: ${{ github.workspace }}/avon/build/avon
          SKIJACK_REDUCER: check
        run: python -m pytest -q

  types:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "python[types]"
      - name: Type-check
        working-directory: python
        run: python -m mypy

  package:
    name: sdist + wheel build, twine check, clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel into a clean environment
        working-directory: python
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/skijack --help
          /tmp/clean/bin/python -c "import skijack; from skijack import corpus; print(skijack.compile(corpus.read('interp-whnff')).sizes['whnfF'])"
